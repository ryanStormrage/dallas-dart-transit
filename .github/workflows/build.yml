name: Rebuild from latest DART feed

on:
  push:
    branches: [main]
    paths: ["build.py", "sql/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "23 9 * * 1"    # Mondays 09:23 UTC (DART updates its feed with each service change)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download feed, analyze, build dashboard + report
        run: python build.py
      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs results
          git diff --cached --quiet || git commit -m "Rebuild from DART feed $(date -u +%F)"
          git push
